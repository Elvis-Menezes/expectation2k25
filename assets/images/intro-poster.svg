<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#ffd400"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" />
  <g transform="translate(140,240)">
    <text x="0" y="0" font-family="Orbitron, Arial, sans-serif" font-size="120" fill="#ffffff" style="letter-spacing:8px;" filter="url(#glow)">E[X]PECTATIONS</text>
    <text x="0" y="140" font-family="Rajdhani, Arial, sans-serif" font-size="90" fill="#ffd400" style="letter-spacing:6px;">2025</text>
  </g>
  <g transform="translate(140,420)" opacity="0.2">
    <rect x="0" y="0" width="400" height="220" rx="18" fill="#000" />
  </g>
</svg>